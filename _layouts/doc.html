{%- assign seg = page.path | split: "/" | first -%}
{%- assign rtl = false -%}{%- if seg == "ar" -%}{%- assign rtl = true -%}{%- endif -%}
<!DOCTYPE html>
<html lang="{{ seg }}"{% if rtl %} dir="rtl"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
  :root{
    --bg:#0f0f10; --bg2:#161618; --card:#1a1a1d;
    --border:#25252a; --border2:#1f1f22;
    --text:#ffffff; --text2:#d7d7d7; --muted:#aaaaaa; --dim:#888888;
    --red:#ff1a1a; --redsoft:rgba(255,26,26,.10); --redborder:rgba(255,26,26,.35);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text2);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--red); text-decoration:none}
  a:hover{text-decoration:underline}

  .topbar{
    border-bottom:1px solid var(--border2); background:rgba(15,15,16,.85);
    backdrop-filter:saturate(140%) blur(6px); position:sticky; top:0; z-index:5;
  }
  .topbar .inner{max-width:760px; margin:0 auto; padding:14px 20px; display:flex; align-items:center}
  .home{display:inline-flex; align-items:center; gap:10px; color:var(--text)}
  .home:hover{text-decoration:none; opacity:.85}
  .home span{font-size:18px; font-weight:700; letter-spacing:.4px}

  main{max-width:760px; margin:0 auto; padding:36px 20px 64px}

  .content h1{
    color:var(--text); font-size:28px; line-height:1.25; font-weight:700;
    margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--border);
  }
  .content h2{color:var(--text); font-size:19px; font-weight:700; margin:34px 0 10px}
  .content h3{color:var(--text); font-size:16px; font-weight:600; margin:24px 0 8px}
  .content p{margin:12px 0}
  .content strong{color:var(--text)}
  .content em{color:var(--muted)}
  .content ul,.content ol{padding-inline-start:22px; margin:12px 0}
  .content li{margin:6px 0}
  .content hr{border:none; height:1px; background:var(--border2); margin:30px 0}
  .content blockquote{
    margin:18px 0; padding:2px 16px; border-inline-start:3px solid var(--redborder);
    color:var(--muted);
  }
  .content a{word-break:break-word}

  .content table{width:100%; border-collapse:collapse; margin:16px 0; font-size:14.5px}
  .content th,.content td{
    border:1px solid var(--border); padding:9px 12px; text-align:start; vertical-align:top;
  }
  .content th{background:var(--bg2); color:var(--text); font-weight:600}
  .content tr:nth-child(even) td{background:rgba(255,255,255,.015)}

  footer{
    border-top:1px solid var(--border2); color:var(--dim); font-size:13px; text-align:center;
    padding:22px 20px 40px;
  }
  footer a{color:var(--muted)}

  @media (max-width:540px){
    main{padding:26px 16px 48px}
    .content h1{font-size:24px}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="home" href="/">
        <svg width="30" height="26" viewBox="0 0 383 331" aria-hidden="true">
          <path d="M6.33714 329C6.33714 329 49.3371 140 108.337 131C167.337 122 181.837 281 243.837 267C305.837 253 368.337 19 368.337 19"
                fill="none" stroke="#ff1a1a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="368.337" cy="14.5" rx="22" ry="22" fill="#ff1a1a"/>
        </svg>
        <span>Dycers</span>
      </a>
    </div>
  </header>

  <main>
    <article class="content">
      {{ content }}
    </article>
  </main>

  <footer>
    © LF Digital Ventures — Dycers · <a href="/">Home</a> · <a href="mailto:contact@dycers.com">contact@dycers.com</a>
  </footer>
</body>
</html>
